[package]
name = "master-pdf-tool"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "master_pdf"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tool-protocol = { path = "../shared" }
lopdf = { version = "0.42.0", default-features = false }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
