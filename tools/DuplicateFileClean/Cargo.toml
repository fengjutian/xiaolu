[package]
name = "duplicate-file-tool"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "DuplicateFileClean"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tool-protocol = { path = "../shared" }
walkdir = "2.5"
sha2 = "0.10"

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
