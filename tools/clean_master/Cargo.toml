[package]
name = "clean-master-tool"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "clean_master"
path = "src/main.rs"

[dependencies]
clean-core = { path = "../cleaner" }
serde_json = "1"
tool-protocol = { path = "../shared" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
