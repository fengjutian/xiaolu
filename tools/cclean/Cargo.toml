[package]
name = "cclean-tool"
version = "0.2.1"
edition = "2021"

[[bin]]
name = "cclean"
path = "src/main.rs"

[dependencies]
clean-core = { path = "../cleaner" }
serde_json = "1"
sysinfo = "0.40.1"
tool-protocol = { path = "../shared" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
