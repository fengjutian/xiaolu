[package]
name = "winopt-assistant-tool"
version = "0.3.0"
edition = "2021"

[[bin]]
name = "winopt_assistant"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tool-protocol = { path = "../shared" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"

[target."cfg(windows)".dependencies]
winreg = "0.55"
