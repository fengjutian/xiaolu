[package]
name = "omni-zip-tool"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "omni_zip"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tool-protocol = { path = "../shared" }
walkdir = "2.5.0"
zip = { version = "2.6.1", default-features = false, features = ["deflate", "time"] }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"
