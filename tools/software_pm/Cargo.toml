[package]
name = "software-pm-tool"
version = "0.7.1"
edition = "2021"

[[bin]]
name = "software_pm"
path = "src/main.rs"

[dependencies]
serde_json = "1"
tool-protocol = { path = "../shared" }

[profile.release]
panic = "abort"
strip = true
lto = true
opt-level = "s"

[target."cfg(windows)".dependencies]
winreg = "0.55"
