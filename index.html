<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d13" />
    <title>&#23567;&#40065; &#183; &#31995;&#32479;&#36879;&#38236;</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #0b0d13; }
      body {
        min-width: 980px;
        min-height: 100vh;
        overflow: hidden;
        color: #e8edf9;
        font-family: Inter, "Segoe UI", "Microsoft YaHei", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #root { min-height: 100vh; }
      .boot-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 38%, rgba(76, 110, 245, 0.16), transparent 34%),
          radial-gradient(circle at 12% 92%, rgba(18, 184, 134, 0.08), transparent 30%),
          #0b0d13;
      }
      .boot-splash::before {
        content: "";
        position: absolute;
        width: 620px;
        height: 620px;
        border-radius: 50%;
        border: 1px solid rgba(116, 143, 252, 0.08);
        box-shadow:
          0 0 0 110px rgba(116, 143, 252, 0.025),
          0 0 0 220px rgba(116, 143, 252, 0.015);
      }
      .boot-splash__inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-bottom: 5vh;
        text-align: center;
      }
      .boot-logo-shell {
        position: relative;
        display: grid;
        place-items: center;
        width: 136px;
        height: 136px;
        margin-bottom: 26px;
      }
      .boot-logo-shell::before {
        content: "";
        position: absolute;
        inset: 12px;
        border-radius: 50%;
        background: rgba(76, 110, 245, 0.55);
        filter: blur(26px);
        animation: boot-glow 2.4s ease-in-out infinite;
      }
      .boot-logo-shell::after {
        content: "";
        position: absolute;
        inset: 0;
        border: 1px solid rgba(116, 143, 252, 0.38);
        border-radius: 50%;
        animation: boot-ring 2.4s ease-out infinite;
      }
      .boot-logo {
        position: relative;
        z-index: 1;
        width: 104px;
        height: 104px;
        border-radius: 50%;
        object-fit: cover;
        border: 1px solid rgba(255, 255, 255, 0.22);
        box-shadow:
          0 18px 46px rgba(19, 45, 110, 0.55),
          0 0 0 7px rgba(255, 255, 255, 0.035);
        animation: boot-float 2.8s ease-in-out infinite;
      }
      .boot-title {
        font-size: 25px;
        font-weight: 800;
        letter-spacing: 0.18em;
        line-height: 1.2;
        color: #f4f7ff;
      }
      .boot-subtitle {
        margin-top: 8px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.46em;
        color: #7483a5;
      }
      .boot-progress {
        width: 176px;
        height: 3px;
        margin-top: 30px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.075);
      }
      .boot-progress span {
        display: block;
        width: 44%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, transparent, #748ffc 45%, #22b8cf, transparent);
        animation: boot-progress 1.7s ease-in-out infinite;
      }
      .boot-status {
        margin-top: 15px;
        font-size: 12px;
        letter-spacing: 0.12em;
        color: #8b96ad;
      }
      @keyframes boot-progress {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(340%); }
      }
      @keyframes boot-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }
      @keyframes boot-glow {
        0%, 100% { opacity: 0.45; transform: scale(0.94); }
        50% { opacity: 0.8; transform: scale(1.06); }
      }
      @keyframes boot-ring {
        0% { opacity: 0.65; transform: scale(0.9); }
        70%, 100% { opacity: 0; transform: scale(1.16); }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-logo,
        .boot-logo-shell::before,
        .boot-logo-shell::after,
        .boot-progress span { animation: none; }
        .boot-progress span { width: 100%; transform: none; opacity: 0.7; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash" role="status" aria-live="polite" aria-label="&#23567;&#40065;&#31995;&#32479;&#36879;&#38236;&#27491;&#22312;&#21551;&#21160;">
        <div class="boot-splash__inner">
          <div class="boot-logo-shell">
            <img class="boot-logo" src="/logo.png" alt="" width="104" height="104" />
          </div>
          <div class="boot-title">&#23567;&#40065;</div>
          <div class="boot-subtitle">SYSTEM LENS</div>
          <div class="boot-progress" aria-hidden="true"><span></span></div>
          <div class="boot-status">&#27491;&#22312;&#21551;&#21160;&#31995;&#32479;&#36879;&#38236;&#8230;</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
