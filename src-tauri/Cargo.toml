[package]
name = "system-lens"
version = "0.40.0"
description = "Local-first Windows system information and health dashboard"
authors = ["System Lens contributors"]
edition = "2021"

[lib]
name = "system_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40.1"
rusqlite = { version = "0.37", features = ["bundled"] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
walkdir = "2.5.0"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target."cfg(windows)".dependencies]
winreg = "0.55"
