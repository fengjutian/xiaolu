[package]
name = "system-lens"
version = "0.1.0"
description = "Local-first Windows system information and health dashboard"
authors = ["System Lens contributors"]
edition = "2021"

[lib]
name = "system_lens_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
sysinfo = "0.40.1"
tauri = { version = "2", features = [] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
